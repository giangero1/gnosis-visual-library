<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gnosis Visual Library</title><style>body{max-width:900px;margin:40px auto;padding:16px;background:#101724;color:#f3ead6;font:18px/1.6 system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}img{width:100%;border-radius:12px}a{color:#efcb7c}</style><h1>Gnosis Visual Library</h1><p>Visual stories, sacred artwork and Scripture reflections from <a href="https://www.instagram.com/gnosis_saints/">@gnosis_saints</a>.</p><p>Use Gnosis for translated descriptions, Scripture and anonymous community polls. AI artwork illustrates the stories; reflections are generated commentary.</p><main id="gallery"></main><script>fetch('catalog/en.json').then(r=>r.json()).then(m=>{for(const item of m.items.filter(i=>i.kind==='wallpaper'&&!i.withdrawn).slice(0,60)){const a=document.createElement('a');a.href=item.imageUrl;const img=document.createElement('img');img.src=item.thumbnailUrl;img.alt=item.translations.en.title;img.loading='lazy';a.append(img,document.createTextNode(item.translations.en.title));document.querySelector('main').append(a)}}).catch(()=>{});</script></html>
